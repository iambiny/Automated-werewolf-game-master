<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#090b12" />
    <title>Werewolf GM — Offline</title>
    <style>
      body {
        background: #090b12;
        color: #f7f0df;
        font: 18px system-ui;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        text-align: center;
      }
      main {
        max-width: 32rem;
        padding: 2rem;
      }
      h1 {
        color: #d6b36a;
      }
      a {
        color: #f7f0df;
      }

  <body>
    <main>
      <h1>The village is offline.</h1>
      <p>
        The game works offline after it has loaded once. Reopen the cached app
        to continue your saved match.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
